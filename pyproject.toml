[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdkeeper"
version = "0.2.0"
description = "Access hygiene and joiner/mover/leaver CLI for Atlassian Crowd admins"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crowdkeeper = "crowdkeeper.cli:main"

[tool.setuptools]
packages = ["crowdkeeper"]
